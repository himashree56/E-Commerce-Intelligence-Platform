[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    # Ignore upstream dateutil Python 3.12 deprecation warning
    ignore::DeprecationWarning:dateutil\.tz\.tz.*:
    # Ignore upstream pyarrow/pandas deprecations if any
    ignore::DeprecationWarning:pyspark.*:
    # Ignore upstream joblib Python 3.12 AST deprecation warning for Python 3.14 (joblib._utils)
    ignore::DeprecationWarning:joblib\._utils.*:
